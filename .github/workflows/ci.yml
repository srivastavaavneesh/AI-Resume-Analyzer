# -----------------------------------------------------------------------------
# File: ci.yml
# Purpose: Continuous Integration workflow for AI Resume Analyzer.
#          Runs on push/pull requests to main, develop, and feature branches.
#          Ensures code quality (Black, isort, Ruff) and executes test suite.
# -----------------------------------------------------------------------------

name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install uv (fast dependency manager)
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Install dependencies
      - name: Install dependencies
        run: uv sync

      # Code formatting checks
      - name: Run Black
        run: uv run black --check .

      - name: Run isort
        run: uv run isort --check-only .

      # Linting
      - name: Run Ruff
        run: uv run ruff check .

      # Run test suite
      - name: Run Tests
        run: uv run pytest