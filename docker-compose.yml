# -----------------------------------------------------------------------------
# File: docker-compose.yml
# Purpose: Defines multi-container setup for the AI Resume Analyzer project.
#          Handles service build, environment variables, ports, and restart policy.
# -----------------------------------------------------------------------------

version: "3.9"

services:
  ai-resume-analyzer:
    build:
      context: .                # Build from current directory
      dockerfile: Dockerfile    # Use specified Dockerfile
    container_name: ai-resume-analyzer
    ports:
      - "8000:8000"             # Map host port 8000 to container port 8000
    env_file:
      - .env                    # Load environment variables from .env file
    restart: unless-stopped      # Auto-restart unless manually stopped